<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171714">
<title>DineFlow — Restaurant Demo</title>
<style>
:root{--ink:#202019;--muted:#77776d;--gold:#c59b5b;--cream:#f7f5ef;--line:#e9e5db;--green:#28734d;--red:#a94438;--shadow:0 12px 35px #1e1b1110}
*{box-sizing:border-box}body{margin:0;background:#f2f0e9;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:auto;padding:18px}.top{background:#191a16;color:white;border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:#171714;font-size:22px}.brand b{letter-spacing:2px;font-size:16px}.brand small{display:block;color:#c7c1b5;font-size:10px;letter-spacing:2px;margin-top:3px}.demo{font-size:11px;color:#e4c58e;border:1px solid #806c49;border-radius:30px;padding:7px 11px}.switch{display:flex;background:#30312b;border-radius:12px;padding:4px;gap:4px}.switch button{background:transparent;color:#ddd;padding:10px 14px;border-radius:9px;font-size:13px}.switch button.active{background:var(--gold);color:#171714;font-weight:700}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px}.side,.panel,.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.side{padding:14px;height:max-content;position:sticky;top:15px}.side h4{margin:5px 9px 12px;color:#89877d;font-size:10px;letter-spacing:1.5px}.nav{width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:10px;color:#55564e;font-size:13px;margin:2px 0}.nav.active,.nav:hover{background:#f4efe4;color:#77572b;font-weight:700}.main{min-width:0}.hero{border-radius:18px;overflow:hidden;min-height:260px;background:linear-gradient(90deg,#171812 0%,#171812e8 43%,#17181235 100%),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=85') center/cover;color:white;padding:35px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#e2c28b;font-size:11px;letter-spacing:2px;font-weight:700}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,5vw,55px);line-height:1.04;margin:12px 0;max-width:500px}.hero p{color:#e1ded5;max-width:430px;line-height:1.6;font-size:14px}.btn{background:var(--gold);color:#1c1b16;padding:11px 16px;border-radius:10px;font-weight:700;font-size:13px}.btn.dark{background:#24251f;color:white}.btn.light{background:#f4f0e8;color:#4b412f}.btn.outline{background:white;border:1px solid var(--line);color:#34342e}.btn:disabled{opacity:.4;cursor:not-allowed}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 13px}.section-head h2{font-size:20px;margin:0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.food{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}.food img{width:100%;height:145px;object-fit:cover;display:block}.food .info{padding:12px}.food h3{font-size:14px;margin:0 0 5px}.food p{font-size:11px;color:var(--muted);margin:0 0 10px;min-height:30px;line-height:1.4}.food-foot{display:flex;align-items:center;justify-content:space-between}.price{font-weight:800;font-size:15px}.plus{width:32px;height:32px;border-radius:9px;background:#24251f;color:white;font-size:20px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.quick .card{padding:17px}.quick strong{display:block;margin:7px 0 4px;font-size:13px}.quick span{font-size:11px;color:var(--muted)}.panel{padding:20px}.panel h2{margin:0 0 5px;font-size:21px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}.stat small{color:var(--muted);font-size:11px}.stat b{display:block;font-size:25px;margin:8px 0 2px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line)}.table th{color:#858276;font-weight:600}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;background:#f1eee6;color:#65573e}.pill.green{background:#e7f3eb;color:#28734d}.pill.orange{background:#fff1dc;color:#98641c}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:7px 10px;font-size:11px;border-radius:8px;background:#f0ede5}.field{padding:11px;border:1px solid var(--line);border-radius:9px;width:100%;margin:7px 0 12px;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:13px;border-radius:12px;background:#f7f3e9;color:#6b5735;font-size:12px;line-height:1.5}.cartbar{position:sticky;bottom:12px;margin-top:15px;background:#20211b;color:white;padding:13px 16px;border-radius:13px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.empty{padding:35px;text-align:center;color:var(--muted)}.stamp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}.stamp div{border:1px dashed #c9c1af;border-radius:12px;padding:18px 5px;text-align:center;color:#8a806d}.stamp .got{background:#edf5ee;border:1px solid #c5dfca;color:#28734d}.footer{text-align:center;color:#8a877d;font-size:10px;padding:22px}.mobilebar{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px;padding:8px}.side h4{display:none}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding:25px;min-height:240px}.quick{grid-template-columns:1fr 1fr}.shell{padding:10px}.top{padding:13px;flex-wrap:wrap}.switch{width:100%}.switch button{flex:1}.table-wrap{overflow:auto}.table{min-width:540px}}
@media(max-width:430px){.grid{gap:8px}.food img{height:115px}.food .info{padding:9px}.quick{grid-template-columns:1fr}.two{grid-template-columns:1fr}.hero h1{font-size:36px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
 <div class="brand"><div class="logo">✦</div><div><b>THE URBAN TABLE</b><small>RESTAURANT EXPERIENCE</small></div></div>
 <span class="demo">DINEFLOW · LIVE DEMO</span>
 <div class="switch"><button id="customerTab" class="active" onclick="setMode('customer')">Customer View</button><button id="ownerTab" onclick="setMode('owner')">Owner Dashboard</button></div>
</header>
<div class="layout">
<aside class="side" id="sidebar"></aside>
<main class="main" id="app"></main>
</div>
<div class="footer">DINEFLOW DEMO · Sample restaurant, sample menu and sample data · No real orders or payments</div>
</div>
<script>
const foods=[
 {id:1,name:"Classic Chicken Burger",desc:"Crispy chicken, fresh lettuce & house sauce.",price:280,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80",cat:"Main Course"},
 {id:2,name:"Creamy Alfredo Pasta",desc:"Creamy parmesan sauce with herbs.",price:350,img:"https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80",cat:"Main Course"},
 {id:3,name:"Margherita Pizza",desc:"Mozzarella, tomato & fresh basil.",price:420,img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80",cat:"Main Course"},
 {id:4,name:"Chocolate Brownie",desc:"Warm chocolate brownie with a rich finish.",price:180,img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=700&q=80",cat:"Dessert"},
 {id:5,name:"Fresh Lemonade",desc:"Fresh lemon, mint & a little sweetness.",price:120,img:"https://images.unsplash.com/photo-1513558161293-c126a7c3eaa7?auto=format&fit=crop&w=700&q=80",cat:"Drinks"},
 {id:6,name:"Grilled Chicken",desc:"Herb-marinated chicken with vegetables.",price:390,img:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=700&q=80",cat:"Main Course"}
];
let mode='customer',page='home',cart={},orders=[{id:1042,table:2,item:'Chicken Burger × 2',total:560,status:'Preparing'},{id:1043,table:4,item:'Alfredo Pasta × 1',total:350,status:'New'},{id:1044,table:1,item:'Brownie × 2',total:360,status:'Ready'}],cat='All';
const money=n=>'৳'+n.toLocaleString('en-US');
function setMode(m){mode=m;page=m==='customer'?'home':'overview';render()}
function nav(items){document.getElementById('sidebar').innerHTML='<h4>'+ (mode==='customer'?'YOUR EXPERIENCE':'MANAGEMENT')+'</h4>'+items.map(([id,label,icon])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp; ${label}</button>`).join('')}
function go(p){page=p;render()}
function add(id){cart[id]=(cart[id]||0)+1;render()}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function total(){return foods.reduce((s,f)=>s+f.price*(cart[f.id]||0),0)}
function render(){
 document.getElementById('customerTab').classList.toggle('active',mode==='customer');document.getElementById('ownerTab').classList.toggle('active',mode==='owner');
 if(mode==='customer') customer(); else owner();
}
function customer(){
 nav([['home','Home','⌂'],['menu','Food Menu','☷'],['wifi','Free Wi-Fi','◉'],['rewards','My Rewards','✦'],['cart','My Cart ('+count()+')','🛍']]);
 let a='';
 if(page==='home') a=`<section class="hero"><span class="eyebrow">WELCOME TO THE URBAN TABLE</span><h1>Good Food.<br>Great Moments.</h1><p>Discover delicious food, enjoy a relaxed atmosphere and order right from your table.</p><div><button class="btn" onclick="go('menu')">Explore Our Menu →</button></div></section><div class="quick"><div class="card"><div>☷</div><strong>Digital Menu</strong><span>Browse dishes & prices</span></div><div class="card"><div>◉</div><strong>Free Wi-Fi</strong><span>Connect with one scan</span></div><div class="card"><div>✦</div><strong>Rewards</strong><span>Collect stamps & gifts</span></div></div><div class="notice" style="margin-top:14px">📍 <b>Your table: Table 04</b> · This demo QR automatically identifies the sample table.</div><div class="section-head"><h2>Customer experience, made simple</h2></div><p class="muted">Scan · Browse · Order · Enjoy</p>`;
 if(page==='menu'){a=`<div class="section-head"><div><h2>Our Menu</h2><span class="muted">Freshly prepared, just for you</span></div><span class="pill">TABLE 04</span></div><div class="actions">${['All','Main Course','Dessert','Drinks'].map(c=>`<button class="small" style="${cat===c?'background:#e9d9bd':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid" style="margin-top:13px">${foods.filter(f=>cat==='All'||f.cat===cat).map(f=>`<article class="food"><img src="${f.img}" onerror="this.src='https://images.unsplash.com/photo-1546549032-9571cd6b27df?auto=format&fit=crop&w=700&q=80'"><div class="info"><h3>${f.name}</h3><p>${f.desc}</p><div class="food-foot"><span class="price">${money(f.price)}</span><button class="plus" onclick="add(${f.id})">+</button></div></div></article>`).join('')}</div>${count()?`<div class="cartbar"><span>${count()} item(s) · ${money(total())}</span><button class="btn" onclick="go('cart')">View Cart →</button></div>`:''}`}
 if(page==='cart'){a=`<div class="panel"><h2>Your Order</h2><p class="muted">Table 04 · Review your items before placing a demo order.</p>${count()?foods.filter(f=>cart[f.id]).map(f=>`<div class="section-head"><div><b>${f.name}</b><div class="muted">${money(f.price)} each</div></div><div class="actions"><button class="small" onclick="cart[${f.id}]=Math.max(0,cart[${f.id}]-1);render()">−</button><b>${cart[f.id]}</b><button class="small" onclick="add(${f.id})">+</button></div></div>`).join('')+`<hr style="border:0;border-top:1px solid var(--line)"><div class="section-head"><b>Total</b><b>${money(total())}</b></div><label class="muted">Special instructions (optional)</label><input class="field" placeholder="e.g. Less spicy, no onions"><button class="btn" onclick="placeOrder()">Place Demo Order</button>`:`<div class="empty">Your cart is empty.<br><br><button class="btn" onclick="go('menu')">Browse Menu</button></div>`}</div>`}
 if(page==='wifi')a=`<div class="panel" style="text-align:center;padding:35px"><div style="font-size:45px">◉</div><h2>Connect to Free Wi-Fi</h2><p class="muted">Enjoy complimentary internet while you dine.</p><div class="notice"><b>Network:</b> UrbanTable_Guest<br><b>Password:</b> urban2026</div><p class="muted">In a real setup, this can be a Wi-Fi QR code configured for the restaurant's guest network.</p></div>`;
 if(page==='rewards')a=`<div class="panel"><span class="eyebrow">MEMBER REWARDS</span><h2>Your Digital Stamp Card</h2><p class="muted">Visit us and collect stamps. Complete the card to unlock a treat.</p><div class="stamp">${[1,2,3,4].map((n)=>`<div class="${n<=3?'got':''}"><div style="font-size:25px">${n<=3?'✓':'✦'}</div><b>Visit ${n}</b></div>`).join('')}</div><h2 style="color:var(--green)">1 more visit to go!</h2><p class="muted">Reward: One complimentary dessert (sample offer).</p><div class="notice">Rewards are added after an eligible bill is paid. This demo card uses sample progress.</div></div>`;
 document.getElementById('app').innerHTML=a;
}
function placeOrder(){let id=1045+orders.length;orders.unshift({id,table:4,item:foods.filter(f=>cart[f.id]).map(f=>f.name+' × '+cart[f.id]).join(', '),total:total(),status:'New'});cart={};alert('Demo order placed! Order #'+id+' is now visible in Owner Dashboard.');go('home')}
function owner(){
 nav([['overview','Overview','▦'],['orders','Orders','☷'],['tables','Tables','▤'],['menuadmin','Menu Management','♨'],['customers','Customers','♙'],['loyaltyadmin','Loyalty & Rewards','✦'],['campaigns','Campaigns','✉'],['reports','Sales Reports','▥']]);
 let a='';
 if(page==='overview')a=`<div class="section-head"><div><h2>Good evening, Owner 👋</h2><span class="muted">Here is what's happening at your restaurant.</span></div><span class="pill green">DEMO DATA</span></div><div class="stats"><div class="stat"><small>Today's Orders</small><b>${48+orders.length-3}</b><span class="muted">Sample total</span></div><div class="stat"><small>Today's Revenue</small><b>৳18,450</b><span class="muted">Sample total</span></div><div class="stat"><small>Customers</small><b>520</b><span class="muted">Registered</span></div><div class="stat"><small>Need attention</small><b style="color:#a56d22">35</b><span class="muted">Inactive 20+ days</span></div></div><div class="panel"><div class="section-head" style="margin-top:0"><h2>Recent Orders</h2><button class="small" onclick="go('orders')">View all →</button></div>${orderTable(orders.slice(0,4))}</div><div class="notice" style="margin-top:14px">Tip: Use the left menu to manage orders, tables, menu items and customer rewards. All figures are sample data.</div>`;
 if(page==='orders')a=`<div class="panel"><h2>Order Management</h2><p class="muted">View incoming orders and update their kitchen status.</p>${orderTable(orders)}</div>`;
 if(page==='tables')a=`<div class="panel"><h2>Table Management</h2><p class="muted">Sample table status · QR codes can be generated separately for each table.</p><div class="grid">${Array.from({length:8},(_,i)=>`<div class="card" style="padding:15px"><b>Table ${String(i+1).padStart(2,'0')}</b><p class="muted">${i===1||i===3?'Occupied · Order in progress':'Available'}</p><span class="pill ${i===1||i===3?'orange':'green'}">${i===1||i===3?'Occupied':'Available'}</span><div style="margin-top:12px;font-size:28px">▦</div><button class="small" onclick="alert('Demo QR for Table ${i+1}. Production version will generate a unique QR.')">View QR</button></div>`).join('')}</div></div>`;
 if(page==='menuadmin')a=`<div class="panel"><h2>Menu Management</h2><p class="muted">Sample menu items. In the full product, the owner can add, edit or hide dishes.</p>${foods.map(f=>`<div class="section-head"><div><b>${f.name}</b><div class="muted">${f.cat} · ${money(f.price)}</div></div><span class="pill green">Available</span></div>`).join('')}<button class="btn" onclick="alert('Menu editor will be connected in the production version.')">＋ Add New Item</button></div>`;
 if(page==='customers')a=`<div class="panel"><h2>Customer Management</h2><p class="muted">Customers who have not visited recently.</p><div class="table-wrap"><table class="table"><tr><th>Customer</th><th>Last Visit</th><th>Visits</th><th>Action</th></tr>${[['Rahim Ahmed','25 days ago',8],['Karim Hasan','32 days ago',4],['Sakib Islam','22 days ago',12],['Nusrat Jahan','41 days ago',6]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><button class="small" onclick="alert('Demo: WhatsApp message window would open for ${x[0]}.')">WhatsApp</button></td></tr>`).join('')}</table></div><div class="notice" style="margin-top:14px">In production, customers are shown here only after they register and consent to relevant communication.</div></div>`;
 if(page==='loyaltyadmin')a=`<div class="panel"><h2>Loyalty & Rewards</h2><p class="muted">Set up a simple reward customers want to come back for.</p><div class="two"><div><label class="muted">Stamps required</label><input class="field" value="4" type="number"></div><div><label class="muted">Reward item</label><input class="field" value="Free Dessert"></div></div><div class="notice">Recommended: award a stamp only after a verified, eligible paid order. Prevent duplicate rewards for the same bill.</div><button class="btn" onclick="alert('Demo settings saved locally for this preview.')">Save Demo Settings</button></div>`;
 if(page==='campaigns')a=`<div class="panel"><h2>Customer Campaigns</h2><p class="muted">Bring customers back with helpful offers.</p><label class="muted">Campaign message</label><textarea class="field" rows="4">We miss you! Visit The Urban Table again and enjoy a special treat.</textarea><div class="notice">WhatsApp bulk messaging requires customer opt-in and an approved WhatsApp Business Platform setup. This demo does not send messages.</div><button class="btn" onclick="alert('Campaign preview only. No messages sent.')">Preview Campaign</button></div>`;
 if(page==='reports')a=`<div class="panel"><h2>Sales Reports</h2><p class="muted">Sample performance overview.</p><div class="stats"><div class="stat"><small>Weekly Sales</small><b>৳92,400</b></div><div class="stat"><small>Average Order</small><b>৳384</b></div></div><div style="display:flex;align-items:end;gap:12px;height:150px;padding:15px;border-bottom:1px solid var(--line)">${[45,70,55,90,65,100,80].map((h,i)=>`<div style="flex:1;background:#c59b5b;height:${h}%;border-radius:6px 6px 0 0;position:relative" title="Sample sales"></div>`).join('')}</div><p class="muted">Mon &nbsp; Tue &nbsp; Wed &nbsp; Thu &nbsp; Fri &nbsp; Sat &nbsp; Sun</p></div>`;
 document.getElementById('app').innerHTML=a;
}
function orderTable(list){return `<div class="table-wrap"><table class="table"><tr><th>Order</th><th>Table</th><th>Items</th><th>Total</th><th>Status / Action</th></tr>${list.map(o=>`<tr><td>#${o.id}</td><td>${o.table}</td><td>${o.item}</td><td>${money(o.total)}</td><td><select class="field" style="margin:0;padding:7px;width:auto" onchange="updateStatus(${o.id},this.value)">${['New','Preparing','Ready','Completed'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
function updateStatus(id,s){let o=orders.find(x=>x.id===id);if(o)o.status=s}
render();
</script>
</body></html>
